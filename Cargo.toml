[package]
name = "fastertext"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8.12"
fasttext = "0.8.0"
numpy = "0.29.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
rayon = "1.12.0"
